<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Оплаты и чеки</title>
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#000309; --surface:rgb(5 9 16 / .72); --overlay:rgb(0 77 255 / .06);
  --line:rgb(245 248 255 / .08); --line-strong:rgb(245 248 255 / .2);
  --fg:#F5F8FF; --muted:#7A7D84; --soft:#9AA3B2;
  --accent:#B8D7FF; --accent-soft:rgb(20 77 199 / .22); --focus:#5A94F5; --glow:rgb(19 97 199 / .32);
  --inverse-bg:#F5F8FF; --inverse-fg:#000309;
  --warn:#F1B45C; --warn-soft:rgb(241 180 92 / .14); --ok:#6CD29B; --ok-soft:rgb(108 210 155 / .14);
  --font:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
p,li{text-wrap:pretty}
body{margin:0;background:var(--bg);color:var(--fg);font:500 15px/1.55 var(--font);letter-spacing:-.006em;min-height:100vh}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(70% 420px at 50% -120px,var(--glow) 0%,transparent 100%)}
.wrap{position:relative;z-index:1;max-width:1040px;margin:0 auto;padding:24px 16px 96px;display:flex;flex-direction:column;gap:48px}
a{color:var(--accent);text-underline-offset:3px}
button{font:700 14px/20px var(--font);border-radius:12px;padding:8px 14px;border:1px solid var(--line-strong);background:var(--overlay);color:var(--fg);cursor:pointer}
button:hover{border-color:var(--focus)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:inline-flex;align-items:center;gap:8px;padding:4px 16px;border-radius:100px;background:var(--overlay);border:1px solid var(--line);font-size:14px;line-height:20px;font-weight:700;color:var(--fg);text-decoration:none}
a.brand:hover{border-color:var(--focus)}
.stamp{font-size:13px;color:var(--muted)}

.gate{display:flex;flex-direction:column;gap:12px;max-width:360px}
.gate h1{margin:0 0 8px;font-size:48px;line-height:60px;letter-spacing:-.04em}
.gate input{font:700 24px/32px var(--font);letter-spacing:.3em;color:var(--fg);background:var(--overlay);border:1px solid var(--line-strong);border-radius:12px;padding:12px 14px}
.gate button{background:var(--inverse-bg);border-color:var(--inverse-bg);color:var(--inverse-fg)}
.msg{margin:0;min-height:22px;color:var(--muted);font-size:14px}

h1{font-size:48px;line-height:60px;font-weight:700;letter-spacing:-.04em;margin:0;text-wrap:balance}
h2{margin:0;font-size:24px;line-height:32px;font-weight:700;letter-spacing:-.02em}
.lead{font-size:20px;line-height:28px;letter-spacing:-.018em;margin:16px 0 0;max-width:62ch;color:var(--soft)}
.lead b{color:var(--fg);font-weight:700}
section{display:flex;flex-direction:column;gap:16px}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat{padding:20px;border-radius:20px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.stat b{font-size:32px;line-height:40px;font-weight:700;letter-spacing:-.025em;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat span{font-size:14px;line-height:20px;color:var(--muted)}
.stat.warn{border-color:rgb(241 180 92 / .35)} .stat.warn b{color:var(--warn)}
.stat.ok b{color:var(--ok)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:8px 24px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;color:var(--muted);font:600 13px/20px var(--font);padding:12px 12px 8px 0;white-space:nowrap}
td{padding:14px 12px 14px 0;border-top:1px solid var(--line);vertical-align:top}
th.num,td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.num{font-weight:700}
td.date{white-space:nowrap;color:var(--soft);font-variant-numeric:tabular-nums}
td small{display:block;color:var(--muted);font-size:13px;line-height:18px;margin-top:2px}
tr.total td{border-top:1px solid var(--line-strong);font-weight:700}
th:last-child,td:last-child{padding-right:0}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:100px;font:600 13px/16px var(--font);white-space:nowrap;border:1px solid var(--line);background:var(--overlay);color:var(--soft);text-decoration:none}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
a.chip:hover{border-color:var(--ok)}

.todo{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.rc{padding:20px;border-radius:20px;border:1px solid var(--line-strong);background:linear-gradient(180deg,var(--accent-soft),transparent 140%);display:flex;flex-direction:column;gap:12px}
.rc .when{font:600 13px/16px var(--font);color:var(--accent)}
.rc .sum{font-size:32px;line-height:40px;font-weight:700;letter-spacing:-.025em;font-variant-numeric:tabular-nums}
.field{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:12px;border-top:1px solid var(--line)}
.field div{min-width:0}
.field span{display:block;font-size:12px;line-height:16px;color:var(--muted)}
.field p{margin:0;font-weight:600;overflow-wrap:anywhere}
.field button{flex:none;padding:6px 12px;font-size:13px;border-radius:100px}
.field button.done{color:var(--ok);border-color:var(--ok)}
.rc .note{margin:0;font-size:13px;line-height:18px;color:var(--warn)}
.empty{margin:0;color:var(--muted)}
ul.notes{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;color:var(--soft)}
ul.notes li{padding-left:16px;position:relative}
ul.notes li::before{content:"";position:absolute;left:0;top:10px;width:4px;height:4px;border-radius:50%;background:var(--focus)}
@media (max-width:760px){
  h1,.gate h1{font-size:36px;line-height:44px;letter-spacing:-.03em}
  .stats{grid-template-columns:1fr 1fr}
  .stat b{font-size:24px;line-height:32px}
  .card{padding:8px 16px}
  table{min-width:560px}
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const rub=n=>n==null?"—":n.toLocaleString("ru-RU").replace(/ |\s/g," ")+" ₽";
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const TOPBAR=`<div class="top"><a class="brand" href="./">← Трекер</a><span class="stamp" id="stamp"></span></div>`;

async function decrypt(pack,pass){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",hash:"SHA-256",salt:b64(pack.salt),iterations:pack.iter},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const buf=b64(pack.data);
  const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:buf.slice(0,12)},key,buf.slice(12));
  return JSON.parse(new TextDecoder().decode(plain));
}

/* Пароль спрашиваем при каждом открытии и нигде не запоминаем */
async function gate(){
  const pack=await (await fetch("pay.dat",{cache:"no-cache"})).json();
  $("app").innerHTML=TOPBAR+`<form class="gate" id="gate"><h1>Оплаты</h1>
    <input id="pw" type="password" inputmode="numeric" autocomplete="off" placeholder="••••" autofocus>
    <button>Открыть</button><p class="msg" id="gmsg"></p></form>`;
  $("gate").addEventListener("submit",async e=>{
    e.preventDefault(); $("gmsg").textContent="Проверяю…";
    try{render(await decrypt(pack,$("pw").value.trim()))}
    catch{$("gmsg").textContent="Не тот пароль";$("pw").select()}
  });
}

function render(d){
  const total=d.payments.reduce((s,p)=>s+p.sum,0);
  const todo=d.payments.filter(p=>!p.receipt);
  const noRc=todo.reduce((s,p)=>s+p.sum,0);
  const debt=d.projects.filter(p=>p.tone==="ok").reduce((s,p)=>s+(p.sum-p.got),0);
  const field=(label,val)=>`<div class="field"><div><span>${label}</span><p>${esc(val)}</p></div><button type="button" data-copy="${esc(val)}">Копировать</button></div>`;
  $("app").innerHTML=TOPBAR+`
  <header>
    <h1>Оплаты и чеки</h1>
    <p class="lead">${todo.length?`Осталось выбить <b>${todo.length} ${todo.length===1?"чек":todo.length<5?"чека":"чеков"}</b> на ${rub(noRc)}. Всё выставленное оплачено.`:`Все чеки выданы, всё выставленное оплачено.`}</p>
  </header>
  <div class="stats">
    <div class="stat"><b>${rub(total)}</b><span>получено всего</span></div>
    <div class="stat ok"><b>${rub(total-noRc)}</b><span>закрыто чеками</span></div>
    <div class="stat ${noRc?"warn":""}"><b>${rub(noRc)}</b><span>без чека</span></div>
    <div class="stat"><b>${rub(debt)}</b><span>долг клиента</span></div>
  </div>

  <section>
    <h2>Чеки, которые нужно выбить</h2>
    ${todo.length?`<div class="todo">${todo.map(p=>`<div class="rc">
      <span class="when">Дата чека ${esc(p.date)}</span>
      <span class="sum">${rub(p.sum)}</span>
      ${p.lines.map(l=>field("Наименование",l[0])).join("")}
      ${field("Сумма",String(p.sum))}
      ${field(d.buyer.type+", ИНН",d.buyer.inn)}
      ${p.note?`<p class="note">${esc(p.note)}</p>`:""}
    </div>`).join("")}</div>`:`<p class="empty">Пусто, все чеки выданы.</p>`}
  </section>

  <section>
    <h2>Поступления</h2>
    <div class="card scroll"><table>
      <tr><th>Дата</th><th>За что</th><th class="num">Сумма</th><th>Чек</th></tr>
      ${d.payments.map(p=>`<tr>
        <td class="date">${esc(p.date)}</td>
        <td>${esc(p.what)}${p.receipt?`<small>${p.lines.map(l=>esc(l[0])+" — "+rub(l[1])).join(" · ")}</small>`:""}</td>
        <td class="num">${rub(p.sum)}</td>
        <td>${p.receipt?`<a class="chip ok" href="${esc(p.url)}" target="_blank" rel="noopener">№${esc(p.receipt)} ↗</a>`:`<span class="chip warn">не выдан</span>`}</td>
      </tr>`).join("")}
      <tr class="total"><td></td><td>Всего</td><td class="num">${rub(total)}</td><td></td></tr>
    </table></div>
  </section>

  <section>
    <h2>Проекты</h2>
    <div class="card scroll"><table>
      <tr><th>Проект</th><th class="num">Сумма</th><th class="num">Получено</th><th>Статус</th></tr>
      ${d.projects.map(p=>`<tr>
        <td>${esc(p.name)}<small>${esc(p.terms)}</small></td>
        <td class="num">${rub(p.sum)}</td>
        <td class="num">${rub(p.got)}</td>
        <td><span class="chip ${p.tone==="mute"?"":p.tone}">${esc(p.status)}</span></td>
      </tr>`).join("")}
    </table></div>
  </section>

  <section>
    <h2>Заметки</h2>
    <ul class="notes">${d.notes.map(n=>`<li>${esc(n)}</li>`).join("")}</ul>
    <p class="stamp">Покупатель в чеках: ${esc(d.buyer.name)}</p>
  </section>`;
  $("stamp").textContent="на "+d.asof;
  $("app").addEventListener("click",async e=>{
    const b=e.target.closest("[data-copy]"); if(!b) return;
    try{await navigator.clipboard.writeText(b.dataset.copy);b.textContent="Скопировано";b.classList.add("done");
      setTimeout(()=>{b.textContent="Копировать";b.classList.remove("done")},1400)}catch{}
  });
}
gate();
</script>
</body>
</html>
